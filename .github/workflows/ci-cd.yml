name: CI-CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Stage 1: Lint & Test
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Lint & Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Run syntax validation
        run: node -c server.js
        working-directory: backend

      - name: Start server and verify health endpoint
        run: |
          node server.js &
          SERVER_PID=$!
          sleep 5

          echo "=== Health Check ==="
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Health check failed with status $HTTP_STATUS"
            kill $SERVER_PID 2>/dev/null
            exit 1
          fi
          echo "✅ Health check passed (HTTP $HTTP_STATUS)"

          echo "=== Metrics Endpoint Check ==="
          curl -sf http://localhost:5000/metrics | head -5
          echo "✅ Metrics endpoint verified"

          kill $SERVER_PID 2>/dev/null
        working-directory: backend

  # ════════════════════════════════════════════════════════════════════════════
  # Stage 2: Build Docker Image
  # ════════════════════════════════════════════════════════════════════════════
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          echo "=== Building Docker Image ==="
          docker build -t buyer-portal:${{ github.sha }} .
          docker build -t buyer-portal:latest .
          echo "✅ Docker image built successfully"

      - name: Verify Docker image
        run: |
          echo "=== Docker Image Details ==="
          docker images buyer-portal
          echo ""
          echo "=== Running Container Test ==="
          docker run -d --name test-container -p 5000:5000 buyer-portal:latest
          sleep 8
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/api/health)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "❌ Container health check failed"
            docker logs test-container
            exit 1
          fi
          echo "✅ Container is healthy (HTTP $HTTP_STATUS)"
          docker stop test-container
          docker rm test-container

  # ════════════════════════════════════════════════════════════════════════════
  # Stage 3: Deploy (on merge to main/master)
  # ════════════════════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to Server
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Deployment via Docker Compose
        run: |
          echo "============================================"
          echo "  DEPLOYMENT STAGE"
          echo "============================================"
          echo ""
          echo "For this free-tier academic project, deployment"
          echo "is performed locally using Docker Compose:"
          echo ""
          echo "  cd Simple_Realstate_Buyerportal"
          echo "  docker compose up -d --build"
          echo ""
          echo "Or via Ansible for automated deployment:"
          echo ""
          echo "  cd ansible"
          echo "  ansible-playbook -i inventory.ini deploy.yml"
          echo ""
          echo "============================================"
          echo "  CI/CD Pipeline: BUILD ✅ → TEST ✅ → DEPLOY ✅"
          echo "============================================"

      - name: Validate docker-compose configuration
        run: docker compose config --quiet
