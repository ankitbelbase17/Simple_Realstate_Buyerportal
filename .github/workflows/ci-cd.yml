name: CI-CD-Free-Tier

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm install
        working-directory: backend

      - name: Basic startup check
        run: |
          node server.js &
          sleep 5
          curl -f http://localhost:5000/api/health
        working-directory: backend

      - name: Build Docker image
        run: docker build -t buyer-portal:${{ github.sha }} .

  deploy-local-demo:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Deployment note
        run: |
          echo "For free-tier submission: run docker compose up -d on your own machine/VPS after pull."
          echo "This workflow validates automation and build integrity without paid hosting."
