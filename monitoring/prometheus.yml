global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: buyer-portal
    metrics_path: /metrics
    static_configs:
      - targets: ['app:5000']
        labels:
          service: 'buyer-portal-app'

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
