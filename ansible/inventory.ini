# ============================================================================
# Ansible Inventory File
# ============================================================================
# Update the IP address below with your VirtualBox VM's IP.
# The default Vagrant private network IP is 192.168.56.10
# ============================================================================

[webservers]
vm1 ansible_host=192.168.56.10 ansible_user=vagrant ansible_ssh_private_key_file=../.vagrant/machines/default/virtualbox/private_key ansible_ssh_common_args='-o StrictHostKeyChecking=no'
